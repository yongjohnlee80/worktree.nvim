name: ci

on:
  push:
    branches: [main]
  pull_request:
  # For the `drift` job below only — it must not run on a PR, and a schedule
  # cannot be triggered by hand when you want to check it.
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

# Least privilege: these jobs only read the tree.
permissions:
  contents: read

# The EVENT is part of the group, and cancellation is limited to PRs.
#
# `github.ref` alone is not enough: on a `schedule` event it is the DEFAULT
# BRANCH ref — the same value a push to main has — so a merge landing during
# the Monday drift run would cancel it. A cancelled run is not a failure: it
# reports nothing and looks like nothing happened, which is precisely how a
# drift signal stops arriving without anyone noticing. That is the same failure
# the drift job exists to prevent, arriving by another route. (gold-man, r1 O3.)
#
# cancel-in-progress is kept for pull_request, where a superseded run proves
# nothing about the head that replaced it, and dropped everywhere else, where
# each commit deserves its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# worktree.nvim had no automated gate, and two of its suites were aborting
# MID-RUN on a stale sibling auto-core before #9 — the kind of failure that
# reports a clean-looking partial run rather than a red one. `tests/run-all.sh`
# already catches that: it parses each suite's summary line and treats its
# ABSENCE as a hard failure. CI does not reimplement that; it supplies the
# environment and lets the runner be the judge.
jobs:
  lua:
    runs-on: ubuntu-latest
    # No pty suite here (auto-core's timeout exists for its pty deadlock todo;
    # this repo has no tests/ui). This bounds a job that hangs for any other
    # reason rather than letting it burn the runner's full allowance.
    timeout-minutes: 15
    steps:
      # Pinned by commit SHA, not by tag: a tag can be moved to different code
      # under the same name.
      #
      # NO branch-restoring step — that is the one thing behaving differently
      # per trigger entry (actions/checkout checks the branch out on push
      # rather than detaching, so `git branch --force main` exits 128), and an
      # entry whose first firing is the merge cannot be witnessed beforehand.
      # Removing the per-entry difference is the fix. fetch-depth does not vary
      # by event, so restoring it below does not reintroduce that.
      #
      # fetch-depth: 0 IS needed here, and my first pass got it wrong. I
      # checked for three specific symbols — default_branch,
      # local_branch_exists, list_branches — which is the set auto-core's step
      # PROVIDES, not the set of repository operations these suites perform.
      # adr0081-migration-gate extracts the SHIPPED v0.5.7 reader with
      # `git show v0.5.7:lua/...`, so its frozen fixtures are proven against
      # the real old code rather than a hand-written imitation. A shallow clone
      # has neither the tag nor its blobs, and the gate said so:
      # "tag v0.5.7 is not present in this checkout".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: install neovim
        env:
          # Pinned by VERSION AND CHECKSUM. A GitHub release asset can be
          # replaced under the same tag and name, so the version alone is not
          # reproducible; the SHA-256 is the real pin. v0.12.5 is the version
          # these suites were verified against locally. Recompute when bumping.
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          # --retry: a transient network blip should not fail a PR for reasons
          # unrelated to its change.
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Pinned by commit, so an upstream change cannot become a mystery failure
      # on an unrelated PR here. The cost of that pin — a consumer frozen
      # against its dependency can never observe an upstream regression — is
      # paid by the `drift` job below, not by weakening this one.
      - name: install plugin dependencies
        env:
          AUTO_CORE_REF: "bc4d998bc22f0644b80e3e89cfe3e1b92d71d32a"  # main @ v0.2.15
          PLENARY_REF:   "74b06c6c75e4eeb3108ec01852001636d85a932b"
        run: ./.github/install-deps.sh

      # Named "assert", not "verify", because it CAN fail: it compares the
      # running nvim against the pin and checks BOTH resolution shapes. A step
      # that only prints a version is the present-and-blind shape — it converts
      # "nobody checked" into "checked and fine".
      - name: assert the toolchain and both dependency shapes
        env:
          NVIM_VERSION: "v0.12.5"
        run: |
          got="$(nvim --version | head -1 | awk '{print $2}')"
          echo "nvim: $got (pinned $NVIM_VERSION)"
          test "$got" = "$NVIM_VERSION"
          lazy="$HOME/.local/share/nvim/lazy"
          siblings="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          test -d "$lazy/plenary.nvim"
          test -d "$lazy/auto-core.nvim"
          test -d "$siblings/auto-core.nvim/main"

      # A developer machine always has one; a runner has none. Most suites pass
      # `-c user.email=... -c user.name=...` per invocation, but smoke 10g goes
      # through the PRODUCT — repos.commit shells out to git and is right to
      # take the ambient identity rather than invent one. So CI supplies what
      # the environment owes it, instead of the product working around its
      # absence. Without this: "Author identity unknown".
      - name: give git an identity (repos.commit uses the ambient one)
        run: |
          git config --global user.name  "auto-agents ci"
          git config --global user.email "ci@example.invalid"

      - name: tests/run-all.sh
        run: ./tests/run-all.sh

  # CONSUMER DRIFT.
  #
  # The reason auto-core got CI first is that a regression there reaches its
  # consumers before anyone notices — and a consumer pinned to a frozen
  # auto-core is precisely the thing that cannot notice. Both properties are
  # wanted and they conflict, so they are split rather than traded: `lua` pins
  # and gates, this resolves auto-core at its DEFAULT BRANCH.
  #
  # Schedule and manual dispatch ONLY — deliberately not `push`. On push it
  # would redden the merge run for an upstream change unrelated to the PR being
  # merged, and would put a code path on the merge that no PR run exercised.
  #
  # This repo is where drift bites hardest: #9 was a suite binding to an
  # auto-core that existed but could not serve the request, and install-deps.sh
  # asserts the same {file, symbol} predicate the suite does — so a drift run
  # fails NAMING the missing symbol rather than aborting mid-suite.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: install neovim
        env:
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The ONE difference from `lua`: auto-core rides its default branch.
      - name: install plugin dependencies (auto-core at HEAD)
        env:
          AUTO_CORE_REF: ""   # empty => default branch
          PLENARY_REF:   "74b06c6c75e4eeb3108ec01852001636d85a932b"
        run: ./.github/install-deps.sh

      - name: report which auto-core is under test
        run: |
          siblings="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          git -C "$siblings/auto-core.nvim/main" log --oneline -1

      # A developer machine always has one; a runner has none. Most suites pass
      # `-c user.email=... -c user.name=...` per invocation, but smoke 10g goes
      # through the PRODUCT — repos.commit shells out to git and is right to
      # take the ambient identity rather than invent one. So CI supplies what
      # the environment owes it, instead of the product working around its
      # absence. Without this: "Author identity unknown".
      - name: give git an identity (repos.commit uses the ambient one)
        run: |
          git config --global user.name  "auto-agents ci"
          git config --global user.email "ci@example.invalid"

      - name: tests/run-all.sh
        run: ./tests/run-all.sh

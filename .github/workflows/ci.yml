name: ci

on:
  push:
    branches: [main]
  pull_request:
  # For the `drift` job below only — it must not run on a PR, and a schedule
  # cannot be triggered by hand when you want to check it.
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      force_drift_failure:
        description: >-
          Fail the drift job deliberately, to exercise the failure notifier.
          The point of the notifier is that an unread signal is not a signal;
          an untested notifier is the same bug one layer up, so there has to be
          a way to make it fire on demand.
        type: boolean
        default: false

# Least privilege: these jobs only read the tree.
permissions:
  contents: read

# The EVENT is part of the group, and cancellation is limited to PRs.
#
# `github.ref` alone is not enough: on a `schedule` event it is the DEFAULT
# BRANCH ref — the same value a push to main has — so a merge landing during
# the Monday drift run would cancel it. A cancelled run is not a failure: it
# reports nothing and looks like nothing happened, which is precisely how a
# drift signal stops arriving without anyone noticing. That is the same failure
# the drift job exists to prevent, arriving by another route. (gold-man, r1 O3.)
#
# cancel-in-progress is kept for pull_request, where a superseded run proves
# nothing about the head that replaced it, and dropped everywhere else, where
# each commit deserves its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# worktree.nvim had no automated gate, and two of its suites were aborting
# MID-RUN on a stale sibling auto-core before #9 — the kind of failure that
# reports a clean-looking partial run rather than a red one. `tests/run-all.sh`
# already catches that: it parses each suite's summary line and treats its
# ABSENCE as a hard failure. CI does not reimplement that; it supplies the
# environment and lets the runner be the judge.
jobs:
  lua:
    runs-on: ubuntu-latest
    # No pty suite here (auto-core's timeout exists for its pty deadlock todo;
    # this repo has no tests/ui). This bounds a job that hangs for any other
    # reason rather than letting it burn the runner's full allowance.
    timeout-minutes: 15
    steps:
      # Pinned by commit SHA, not by tag: a tag can be moved to different code
      # under the same name.
      #
      # NO branch-restoring step — that is the one thing behaving differently
      # per trigger entry (actions/checkout checks the branch out on push
      # rather than detaching, so `git branch --force main` exits 128), and an
      # entry whose first firing is the merge cannot be witnessed beforehand.
      # Removing the per-entry difference is the fix. fetch-depth does not vary
      # by event, so restoring it below does not reintroduce that.
      #
      # fetch-depth: 0 IS needed here, and my first pass got it wrong. I
      # checked for three specific symbols — default_branch,
      # local_branch_exists, list_branches — which is the set auto-core's step
      # PROVIDES, not the set of repository operations these suites perform.
      # adr0081-migration-gate extracts the SHIPPED v0.5.7 reader with
      # `git show v0.5.7:lua/...`, so its frozen fixtures are proven against
      # the real old code rather than a hand-written imitation. A shallow clone
      # has neither the tag nor its blobs, and the gate said so:
      # "tag v0.5.7 is not present in this checkout".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: install neovim
        env:
          # Pinned by VERSION AND CHECKSUM. A GitHub release asset can be
          # replaced under the same tag and name, so the version alone is not
          # reproducible; the SHA-256 is the real pin. v0.12.5 is the version
          # these suites were verified against locally. Recompute when bumping.
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          # --retry: a transient network blip should not fail a PR for reasons
          # unrelated to its change.
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Pinned by commit, so an upstream change cannot become a mystery failure
      # on an unrelated PR here. The cost of that pin — a consumer frozen
      # against its dependency can never observe an upstream regression — is
      # paid by the `drift` job below, not by weakening this one.
      - name: install plugin dependencies
        env:
          AUTO_CORE_REF: "bc4d998bc22f0644b80e3e89cfe3e1b92d71d32a"  # main @ v0.2.15
          PLENARY_REF:   "74b06c6c75e4eeb3108ec01852001636d85a932b"
        run: ./.github/install-deps.sh

      # Named "assert", not "verify", because it CAN fail: it compares the
      # running nvim against the pin and checks BOTH resolution shapes. A step
      # that only prints a version is the present-and-blind shape — it converts
      # "nobody checked" into "checked and fine".
      - name: assert the toolchain and both dependency shapes
        env:
          NVIM_VERSION: "v0.12.5"
        run: |
          got="$(nvim --version | head -1 | awk '{print $2}')"
          echo "nvim: $got (pinned $NVIM_VERSION)"
          test "$got" = "$NVIM_VERSION"
          lazy="$HOME/.local/share/nvim/lazy"
          siblings="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          test -d "$lazy/plenary.nvim"
          test -d "$lazy/auto-core.nvim"
          test -d "$siblings/auto-core.nvim/main"

      # A developer machine always has one; a runner has none. Most suites pass
      # `-c user.email=... -c user.name=...` per invocation, but smoke 10g goes
      # through the PRODUCT — repos.commit shells out to git and is right to
      # take the ambient identity rather than invent one. So CI supplies what
      # the environment owes it, instead of the product working around its
      # absence. Without this: "Author identity unknown".
      - name: give git an identity (repos.commit uses the ambient one)
        run: |
          git config --global user.name  "auto-agents ci"
          git config --global user.email "ci@example.invalid"

      # The pin's age as ROUTINE INFORMATION, not something discovered while
      # debugging. This job's pin comment read `# main @ v0.2.15` while sitting
      # eighteen commits and three releases behind, and the way that surfaced
      # was a cell failing on CI while passing everywhere else.
      #
      # Reported, never acted on: auto-bumping the pin would defeat the
      # reproducibility it exists for — a gating job that changes under a PR
      # reintroduces the mystery failure on unrelated work that pinning was
      # adopted to prevent. The bump is a human's call, and a reviewed one.
      - name: report how stale the auto-core pin is
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_CORE_REF: "bc4d998bc22f0644b80e3e89cfe3e1b92d71d32a"
        run: |
          # One API call rather than a second clone: compare gives the distance
          # to the default branch directly.
          # AHEAD_BY, not behind_by. For `compare/BASE...HEAD` GitHub reports
          # ahead_by as "commits HEAD has that BASE does not" — which with
          # BASE=pin, HEAD=main is the number wanted here — and behind_by as
          # the reverse, which for an ancestor pin is ALWAYS 0.
          #
          # The first version of this step read behind_by and printed
          # "commits ... that this pin does NOT have: 0" on a pin eight commits
          # stale. It ran green and said the pin was current: an instrument
          # reporting the reassuring answer for every input, which is worse than
          # no instrument. Caught by reading the step's OUTPUT rather than its
          # exit status.
          # The pin appears TWICE in this file: the install step consumes it,
          # this step reports on it. Assert they are the SAME. When this design
          # was copied from auto-finder, this step arrived carrying auto-finder's
          # SHA — so all four copies would have reported the age of a pin they do
          # not use, in a step whose whole job is to notice staleness. Found by
          # comparing the two values; nothing about the copy looked wrong.
          seen="$(grep -oE 'AUTO_CORE_REF: "[0-9a-f]{40}"' .github/workflows/ci.yml \
                   | grep -oE '[0-9a-f]{40}' | sort -u | wc -l)"
          if [ "$seen" -ne 1 ]; then
            echo "::error title=pin mismatch::this workflow names ${seen} different auto-core pins; the age below would describe the wrong one"
            exit 1
          fi
          missing="$(gh api \
            "repos/yongjohnlee80/auto-core.nvim/compare/${AUTO_CORE_REF}...main" \
            --jq '.ahead_by' 2>/dev/null || true)"
          echo "auto-core pin: ${AUTO_CORE_REF}"
          case "$missing" in
            ''|*[!0-9]*)
              # Never silently 0: an unparseable answer is UNKNOWN, and it says
              # so, because "0" here reads as "the pin is current".
              echo "::warning title=auto-core pin age unknown::the compare API did not return a usable ahead_by; pin staleness was NOT determined"
              ;;
            *)
              echo "commits on auto-core main that this pin does NOT have: ${missing}"
              if [ "$missing" -gt 0 ]; then
                msg="the gating job tests a pinned auto-core; the drift job is what notices when the pin goes stale, and bumping it is a deliberate reviewed change, never automatic"
                echo "::notice title=auto-core pin is ${missing} commits behind main::${msg}"
              fi
              ;;
          esac

      - name: tests/run-all.sh
        run: ./tests/run-all.sh

  # CONSUMER DRIFT.
  #
  # The reason auto-core got CI first is that a regression there reaches its
  # consumers before anyone notices — and a consumer pinned to a frozen
  # auto-core is precisely the thing that cannot notice. Both properties are
  # wanted and they conflict, so they are split rather than traded: `lua` pins
  # and gates, this resolves auto-core at its DEFAULT BRANCH.
  #
  # Schedule and manual dispatch ONLY — deliberately not `push`. On push it
  # would redden the merge run for an upstream change unrelated to the PR being
  # merged, and would put a code path on the merge that no PR run exercised.
  #
  # This repo is where drift bites hardest: #9 was a suite binding to an
  # auto-core that existed but could not serve the request, and install-deps.sh
  # asserts the same {file, symbol} predicate the suite does — so a drift run
  # fails NAMING the missing symbol rather than aborting mid-suite.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Raised for THIS JOB ONLY, and only by one step: a failing drift run has to
    # be able to reach a person. The `lua` job keeps the workflow's read-only
    # default.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: install neovim
        env:
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The ONE difference from `lua`: auto-core rides its default branch.
      - name: install plugin dependencies (auto-core at HEAD)
        env:
          AUTO_CORE_REF: ""   # empty => default branch
          PLENARY_REF:   "74b06c6c75e4eeb3108ec01852001636d85a932b"
        run: ./.github/install-deps.sh

      - name: report which auto-core is under test
        run: |
          siblings="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          git -C "$siblings/auto-core.nvim/main" log --oneline -1

      # A developer machine always has one; a runner has none. Most suites pass
      # `-c user.email=... -c user.name=...` per invocation, but smoke 10g goes
      # through the PRODUCT — repos.commit shells out to git and is right to
      # take the ambient identity rather than invent one. So CI supplies what
      # the environment owes it, instead of the product working around its
      # absence. Without this: "Author identity unknown".
      - name: give git an identity (repos.commit uses the ambient one)
        run: |
          git config --global user.name  "auto-agents ci"
          git config --global user.email "ci@example.invalid"

      # Exercisable on demand. The whole point of the step below is that an
      # unread signal is not a signal — so an untested notifier is the same bug
      # one layer up, and there has to be a way to make it fire without waiting
      # for auto-core to break something.
      - name: force a drift failure (notifier self-test)
        if: inputs.force_drift_failure
        run: |
          echo "force_drift_failure was requested: failing deliberately so the"
          echo "notifier below has something to report."
          exit 1

      - name: tests/run-all.sh
        run: ./tests/run-all.sh

      # Found by LABEL, not by title. Title matching breaks the moment somebody
      # edits the title — the next failure opens a duplicate instead of
      # commenting — and `--limit 50` silently stops finding it once the repo
      # passes fifty issues in that state, which is a failure mode with no
      # symptom. `gh label create --force` UPDATES an existing label rather
      # than failing, so this needs no manual setup and stays idempotent.
      # (gold-man, #32 r0 Q2 — the objection I had chosen the fragile option
      # over does not exist.)
      - name: open or update the drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh label create ci-drift --color B60205 \
            --description "this suite fails against auto-core@main" --force
          title="CI drift: this repo's suite fails against auto-core@main"
          num="$(gh issue list --state all --label ci-drift --limit 1 \
                  --json number --jq '.[0].number // empty')"
          body="$(printf '%s\n' \
            "The \`drift\` job resolves auto-core at its DEFAULT BRANCH instead of the pinned commit the gating job uses, and it failed." \
            "" \
            "Run: ${RUN_URL}" \
            "Event: ${GITHUB_EVENT_NAME}  Commit: ${GITHUB_SHA}" \
            "" \
            "This does NOT mean this repo is broken for its users — the gating job pins auto-core and is green. It means auto-core has moved in a way this suite does not accept yet, and one of the two has to change before the pin is bumped." \
            "" \
            "Bumping the pin is a deliberate, reviewed decision and never automatic: a gating job that changes under a PR reintroduces the mystery failure on unrelated work that pinning exists to prevent." \
            "" \
            "This issue CLOSES ITSELF when a drift run passes, so its open/closed state is the answer to \"is auto-core's main compatible today\". If it reopens after somebody closed it, the divergence was still live — that is the point, not noise.")"
          if [ -n "$num" ]; then
            gh issue reopen "$num" >/dev/null 2>&1 || true
            gh issue comment "$num" --body "$body"
            echo "commented on drift issue #$num (reopened if it had been closed)"
          else
            gh issue create --title "$title" --label ci-drift --body "$body"
          fi

      # THE OTHER HALF, and without it the addressee is just a second thing to
      # ignore. `if: failure()` alone leaves the issue open after the
      # divergence clears — and today's episode is the demonstration: drift
      # failed on the p40 regression, the fix landed, a re-dispatch went green,
      # and an issue from that failure would still be open now. The first
      # person to check it, find nothing wrong and close it by hand has learned
      # the issue is noise, which is this task's own defect moved from a red run
      # to an open issue.
      #
      # With this step the issue's OPEN/CLOSED STATE is the answer to "is
      # auto-core's main compatible today", which is the question the job
      # exists to answer. (gold-man, #32 r0 MF1.)
      - name: close the drift issue when the divergence clears
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          num="$(gh issue list --state open --label ci-drift --limit 1 \
                  --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -z "$num" ]; then
            echo "no open drift issue — nothing to clear"
            exit 0
          fi
          gh issue comment "$num" --body "Divergence cleared: the drift job passed against auto-core@main at ${RUN_URL}. Closing, so this issue's state keeps tracking the condition."
          gh issue close "$num"
          echo "closed drift issue #$num"
